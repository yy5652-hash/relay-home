name: keep-warm
# The hosted demo runs on a free Render instance that sleeps after 15 quiet minutes; a sleeping instance takes 15 seconds to
# a minute to answer its first request. Render's free tier has 750 instance hours a month per workspace, shared with another
# demo, so this keeps it awake only while the judges may open it: the Judging Period, 9 November 12:00 PT to 20 November
# 12:00 PT, with a margin either side (08:00 UTC on 9 November to 22:00 UTC on 20 November, about 280 hours).
# GitHub starts scheduled runs late (30 minutes to hours apart), so each run pings for almost six hours, a job's limit, and
# the concurrency group keeps one run waiting behind the running one: when a run ends the next starts at once.
# Minutes are free for a public repository.
on:
  schedule:
    - cron: "7,37 * 9-20 11 *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: keep-warm
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - run: |
          now=$(date -u +%s)
          from=$(date -u -d 2026-11-09T08:00:00Z +%s)
          until=$(date -u -d 2026-11-20T22:00:00Z +%s)
          if [ "$now" -lt "$from" ] || [ "$now" -ge "$until" ]; then
            echo "Outside the Judging Period; nothing to do."
            exit 0
          fi
          stop=$((now + 350 * 60))
          if [ "$stop" -gt "$until" ]; then stop=$until; fi
          while :; do
            curl --silent --show-error --fail --max-time 120 https://relay-home.onrender.com/api/health || true
            echo " $(date -u +%H:%M:%S)"
            if [ $(($(date -u +%s) + 300)) -ge "$stop" ]; then break; fi
            sleep 300
          done
