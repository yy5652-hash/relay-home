<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>A pickup request · Relay Home</title>
<style>
/* The helper's page. Colours: Radix Colors (MIT), light and dark. Icons: Lucide (ISC). */
:root { color-scheme: light dark; --page: #f4f4f7; --card: #ffffff; --ink: #1c2024; --ink2: #60646c; --line: #e3e3e9; --accent: #0d141f; --on-accent: #ffffff; --tint: #00749e; --ok: #2a7e3b; --okbg: #e9f6e9; --no: #d13415; --nobg: #feebe7; }
@media (prefers-color-scheme: dark) { :root { --page: #0b0f14; --card: rgba(255, 255, 255, .06); --ink: #edeef0; --ink2: #b0b4ba; --line: rgba(255, 255, 255, .1); --accent: #7ce2fe; --on-accent: #0d141f; --tint: #75c7f0; --ok: #71d083; --okbg: rgba(70, 167, 88, .17); --no: #ff977d; --nobg: rgba(229, 77, 46, .17); } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px 18px; background: var(--page); color: var(--ink); font: 17px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
@media (prefers-color-scheme: dark) { body { background: radial-gradient(120% 50% at 15% 0%, #16283f 0%, transparent 60%), radial-gradient(120% 60% at 95% 100%, #251d43 0%, transparent 60%), var(--page); } }
/* A screen this narrow is the mock-up phone in the simulator, whose camera island sits over the top of the page. */
@media (max-width: 340px) { body { place-items: start center; padding-top: 64px; font-size: 16px; } h1 { font-size: 27px; } }
main { width: 100%; max-width: 390px; display: grid; gap: 18px; animation: in .5s cubic-bezier(0, 0, .1, 1) both; } @keyframes in { from { opacity: 0; transform: translateY(10px); } }
.from { display: flex; align-items: center; gap: 10px; margin: 0; color: var(--ink2); font-size: 14.5px; }
.from i { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); color: var(--tint); font-style: normal; }
h1 { margin: 0; font-size: 30px; font-weight: 650; line-height: 1.16; letter-spacing: -.025em; }
dl { margin: 0; padding: 4px 18px; border-radius: 22px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
dl div { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); } dl div:first-child { border-top: 0; }
dl svg { color: var(--tint); } dt { color: var(--ink2); font-size: 15.5px; } dd { margin: 0; font-weight: 600; text-align: right; }
.answers { display: grid; gap: 11px; }
button { font: inherit; font-weight: 650; height: 58px; border-radius: 18px; border: 0; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); cursor: pointer; transition: transform .15s, filter .2s; } button:active { transform: scale(.98); }
button.yes { background: var(--accent); box-shadow: none; color: var(--on-accent); } button:disabled { opacity: .5; }
.state { display: grid; grid-template-columns: auto 1fr; gap: 13px; align-items: center; padding: 16px 18px; border-radius: 20px; font-weight: 600; animation: in .45s cubic-bezier(0, 0, .1, 1) both; } .state i { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: currentColor; } .state i svg { color: var(--page); }
.state.ok { background: var(--okbg); color: var(--ok); } .state.no { background: var(--nobg); color: var(--no); } .state.plain { display: block; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); font-weight: 400; }
.small { margin: 0; color: var(--ink2); font-size: 13px; line-height: 1.5; } .link { height: auto; justify-self: start; padding: 4px 0; background: none; box-shadow: none; color: var(--tint); font-weight: 600; font-size: 15.5px; }
</style>
</head>
<body>
<main id="page" aria-live="polite"><p class="from">Opening the request…</p></main>
<script type="module">
// The helper's side of a pickup request. This page knows one thing, the code in its address, and can do one thing
// with it: answer the question that was asked. It cannot see the household.
const code = location.pathname.split('/').pop();
const page = document.getElementById('page');
const el = (tag, attrs = {}, ...children) => { const node = Object.assign(document.createElement(tag), attrs); node.append(...children.filter(Boolean)); return node; };
const PATHS = {"map-pin": "<path d=\"M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0\"/> <circle cx=\"12\" cy=\"10\" r=\"3\"/>", "clock": "<path d=\"M12 6v6l4 2\"/> <circle cx=\"12\" cy=\"12\" r=\"10\"/>", "check": "<path d=\"M20 6 9 17l-5-5\"/>", "x": "<path d=\"M18 6 6 18\"/> <path d=\"m6 6 12 12\"/>", "school": "<path d=\"M14 21v-3a2 2 0 0 0-4 0v3\"/> <path d=\"M18 5v16\"/> <path d=\"m4 6 7.106-3.79a2 2 0 0 1 1.788 0L20 6\"/> <path d=\"m6 11-3.52 2.147a1 1 0 0 0-.48.854V19a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a1 1 0 0 0-.48-.853L18 11\"/> <path d=\"M6 5v16\"/> <circle cx=\"12\" cy=\"9\" r=\"2\"/>"};
const icon = (name, size = 20) => { const holder = document.createElement('span'); holder.innerHTML = `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[name]}</svg>`; return holder.firstChild; };
let shown = null;

async function answer(accepted) {
  for (const button of page.querySelectorAll('button')) button.disabled = true;
  const response = await fetch(`/api/reply/${code}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ accepted }) });
  draw(await response.json());
}

function draw(ask) {
  shown = ask.status ?? null;
  if (!ask.helper) return page.replaceChildren(el('h1', {}, 'This link does not work'), el('p', { className: 'from' }, ask.error ?? 'Ask the family to send it again.'));
  const fact = (name, term, value) => el('div', {}, icon(name), el('dt', {}, term), el('dd', {}, value));
  const facts = el('dl', {}, fact('map-pin', 'Where', ask.where), fact('clock', 'Be there by', ask.by));
  const head = [el('p', { className: 'from' }, el('i', {}, icon('school', 18)), `${ask.from} ask, through Relay Home`), el('h1', {}, `${ask.helper}, can you collect ${ask.child} today?`), facts];
  const foot = el('p', { className: 'small' }, 'This link only answers this one request. A made-up family in a demo: nobody is waiting at a real school.');
  const state = (tone, name, text) => el('p', { className: `state ${tone}` }, el('i', {}, icon(name, 20)), el('span', {}, text));
  if (ask.status === 'awaiting reply') return page.replaceChildren(...head, el('div', { className: 'answers' }, el('button', { className: 'yes', onclick: () => answer(true) }, 'Yes, I will be there'), el('button', { onclick: () => answer(false) }, 'Sorry, I cannot')), foot);
  if (ask.status === 'confirmed') return page.replaceChildren(...head, state('ok', 'check', `Thank you. ${ask.from} can see that you are collecting ${ask.child}.`), el('button', { className: 'link', onclick: () => answer(false) }, 'Something came up, I cannot do it after all'), foot);
  if (ask.status === 'declined') return page.replaceChildren(...head, state('no', 'x', `Understood. ${ask.from} know you cannot do it today.`), foot);
  page.replaceChildren(...head, el('p', { className: 'state plain' }, 'The family took this request back. There is nothing for you to do.'), foot);
}

try { draw(await (await fetch(`/api/reply/${code}`)).json()); } catch { draw({ error: 'The page could not reach Relay Home. Try again in a moment.' }); }
// The family may take the request back while this page is open.
setInterval(async () => { if (document.hidden || page.querySelector('button:disabled')) return; try { const now = await (await fetch(`/api/reply/${code}`)).json(); if (now.status && now.status !== shown) draw(now); } catch { /* try again on the next tick */ } }, 5000);
</script>
</body>
</html>
